# Example clip: an administrator adds a user. Copy it, rename `clip`, and point each target at your app's own
# `data-tour` attributes (/mclip:record proposes them and writes the real scenario for a flow).
# Record on the throwaway tutorial stack only (tools/TutorialRecorder/stack/), never on a copy with real data.
# Credentials come from tools/TutorialRecorder/tutorial.secrets.json (git-ignored): ${users.<key>.<field>}.
clip: example-add-user
title: เพิ่มผู้ใช้ใหม่
baseUrl: http://localhost:5080
mode: caption
# Fresh data before every recording, so a rerun gives the same clip (skip with --no-setup).
setup: ../tools/TutorialRecorder/stack/reset.ps1
roles:
  admin: { userKey: Admin, label: ผู้ดูแลระบบ }
login:
  url: /login
  email: "tour:login-email"
  password: "tour:login-password"
  submit: "tour:login-submit"
  caption: "เข้าสู่ระบบในฐานะ{role}"

steps:
  # Opening card: the introduction is spoken here, before anything happens on screen.
  - action: title
    caption: "เพิ่มผู้ใช้ใหม่"
    subtitle: "สำหรับผู้ดูแลระบบ"
    narration: "คลิปนี้จะแนะนำวิธีเพิ่มผู้ใช้ใหม่ให้เข้าใช้งานระบบค่ะ"

  - role: admin
    action: login
    caption: "เข้าสู่ระบบในฐานะผู้ดูแลระบบ"
    narration: "เริ่มจากเข้าสู่ระบบด้วยบัญชีผู้ดูแลระบบ"

  - role: admin
    action: click
    target: "tour:nav-users"
    highlight: arrow
    caption: "เปิดเมนู ผู้ใช้"
    narration: "ที่เมนูด้านซ้าย เลือกเมนูผู้ใช้"
    waitFor: "tour:btn-add-user"

  - role: admin
    action: click
    target: "tour:btn-add-user"
    highlight: box
    zoom: 1.6
    caption: "กดปุ่ม 'เพิ่มผู้ใช้'"
    narration: "กดปุ่มเพิ่มผู้ใช้ ระบบจะเปิดฟอร์มขึ้นมา"
    callout: "กดปุ่มนี้เพื่อเพิ่มผู้ใช้ใหม่"
    result:
      target: "role:dialog"
      text: "ระบบเปิดฟอร์มให้กรอกข้อมูลผู้ใช้"
    waitFor: "role:dialog"

  - action: zoom-out

  - role: admin
    action: fill
    target: "tour:field-email"
    value: "${users.NewUser.email}"
    caption: "กรอกอีเมลของผู้ใช้ใหม่"
    narration: "กรอกอีเมลที่ผู้ใช้จะใช้เข้าสู่ระบบ"

  - role: admin
    action: click
    target: "tour:btn-save"
    highlight: box
    caption: "กด 'บันทึก'"
    narration: "กดบันทึก ระบบจะสร้างผู้ใช้ใหม่ให้"

  - action: title
    caption: "สรุปขั้นตอน"
    subtitle: "เปิดเมนูผู้ใช้ → เพิ่มผู้ใช้ → กรอกอีเมล → บันทึก"
    narration: "สรุปขั้นตอน เปิดเมนูผู้ใช้ กดเพิ่มผู้ใช้ กรอกอีเมล แล้วกดบันทึกค่ะ"
